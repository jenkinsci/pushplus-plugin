<div>
    发送渠道，支持以下选项：
    <ul>
        <li><b>wechat</b> - 微信公众号(默认)</li>
        <li><b>webhook</b> - 第三方webhook（企业微信、钉钉、飞书、Server酱、IFTTT等）</li>
        <li><b>cp</b> - 企业微信应用</li>
        <li><b>mail</b> - 邮件</li>
        <li><b>sms</b> - 短信</li>
        <li><b>voice</b> - 语音</li>
        <li><b>extension</b> - 浏览器插件</li>
    </ul>
    如不填写，默认使用微信公众号渠道。
</div>
